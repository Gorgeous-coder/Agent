spring:
  application:
    name: Agent
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      chat:
        model: Qwen/Qwen3.5-35B-A3B
      image:
        model: Tongyi-MAI/Z-Image-Turbo
      audio:
        speech:
          model: "FunAudioLLM/CosyVoice2-0.5B"
          voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
  # 数据库配置
  datasource:
    url: jdbc:sqlite:${YKD_WORK_DIR:./work}/sqlite/conversation.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

gaode:
  key: ${GAODE_KEY:}
  js-key: ${GAODE_JS_KEY:}

#  RAG 配置
rag:
  enabled: true
  top-k: 3

#  联网搜索配置
web-search:
  enabled: true
  api-key: ${SERPAPI_KEY:}
  engine: google
  max-results: 5
  timeout-seconds: 15