spring:
  application:
    name: Agent
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      chat:
        model: Qwen/Qwen3.5-35B-A3B
      image:
        model: Tongyi-MAI/Z-Image-Turbo
      audio:
        speech:
          model: "FunAudioLLM/CosyVoice2-0.5B"
          voice: "FunAudioLLM/CosyVoice2-0.5B:alex"

  # ========== 数据库配置 ==========
  datasource:
    url: jdbc:sqlite:${YKD_WORK_DIR:./work}/sqlite/conversation.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:sqlite/schema.sql

# ========== MyBatis 配置 ==========
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.rag.model

# ========== RAG 配置 ==========
app:
  rag:
    ingest-enabled: false

# ========== Web Search 配置 ==========
web-search:
  enabled: true
  api-key: ${SERPAPI_KEY:}
  engine: google
  max-results: 5
  timeout-seconds: 15

# ========== 日志配置 ==========
logging:
  level:
    com.rag: DEBUG
    com.llm.rag: DEBUG
    org.springframework.ai: DEBUG

# ========== ⭐ 高德地图配置 ==========
gaode:
  key: 4ab9d0afea3e5df70840f50706f536d8
  js-key: 0e7a0d2baaaad0a062909205fa5b82f4