<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__ 路线图</title>
    <script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_KEY__&plugin=AMap.ToolBar,AMap.Scale"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 20px 30px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header .badge { background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 14px; }
        .main { display: flex; height: calc(100vh - 70px); }
        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .sidebar {
            width: 360px; background: #fff; overflow-y: auto; padding: 16px;
            box-shadow: -2px 0 12px rgba(0,0,0,0.08);
        }
        .sidebar h2 { font-size: 16px; margin-bottom: 12px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        .day-card {
            border-radius: 12px; margin-bottom: 14px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s;
            cursor: pointer; border: 2px solid transparent;
        }
        .day-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .day-card.active { border-color: #667eea; }
        .day-header { padding: 12px 16px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .day-header .day-num { font-size: 22px; font-weight: 700; }
        .day-header .day-weather { font-size: 13px; opacity: 0.9; }
        .day-body { padding: 10px 16px; }
        .place-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .place-item:last-child { border-bottom: none; }
        .place-icon {
            width: 28px; height: 28px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 12px;
            font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .place-info .place-name { font-size: 14px; font-weight: 600; }
        .place-info .place-meta { font-size: 12px; color: #95a5a6; margin-top: 2px; }
        .place-info .place-desc { font-size: 12px; color: #7f8c8d; margin-top: 4px; line-height: 1.5; }
        .toggle-btn {
            position: absolute; top: 16px; right: 16px; z-index: 1000;
            background: #fff; border: none; padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .toggle-btn:hover { background: #f8f9fa; }
        .legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.92); padding: 10px 16px; border-radius: 10px;
            font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 16px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>__TITLE__ 路线图</h1>
        <span class="badge">三日游完整出行方案</span>
    </div>
    <div class="main">
        <div class="map-container">
            <button class="toggle-btn" id="toggleSidebar" onclick="toggleSidebar()">隐藏行程</button>
            <div id="map"></div>
            <div class="legend" id="legend"></div>
            <div class="loading" id="loading">地图加载中...</div>
        </div>
        <div class="sidebar" id="sidebar">
            <h2>每日行程</h2>
            <div id="dayList"></div>
        </div>
    </div>

    <script>
    const TRAVEL_DATA = __TRAVEL_DATA__;

    if (typeof AMap === 'undefined') {
        document.getElementById('loading').innerHTML =
            '<div style="text-align:center;"><h3 style="color:#e74c3c;">地图加载失败</h3>' +
            '<p style="color:#999;margin-top:8px;">请检查 gaode.js-key 是否已配置正确的高德 JS API Key</p></div>';
        throw new Error('AMap SDK 未加载,请检查 Key 配置');
    }

    const DAY_COLORS = [
        { name: "Day 1", color: "#e74c3c", bg: "#fdeaea", light: "#f5b7b1" },
        { name: "Day 2", color: "#3498db", bg: "#ebf5fb", light: "#85c1e9" },
        { name: "Day 3", color: "#2ecc71", bg: "#eafaf1", light: "#a2d9b5" },
        { name: "Day 4", color: "#f39c12", bg: "#fef5e7", light: "#f5cb95" },
        { name: "Day 5", color: "#8e44ad", bg: "#f3e9f5", light: "#c39bd3" },
    ];

    let map, markers = [], polylines = [], visibleDays = new Set();

    function init() {
        const firstPlace = TRAVEL_DATA.days[0].places[0];
        try {
            map = new AMap.Map('map', {
                zoom: 12,
                center: [firstPlace.longitude, firstPlace.latitude],
                viewMode: '2D'
            });
        } catch (e) {
            document.getElementById('loading').innerHTML =
                '<div style="text-align:center;"><h3 style="color:#e74c3c;">地图初始化失败</h3>' +
                '<p style="color:#999;margin-top:8px;">' + e.message + '</p></div>';
            return;
        }

        map.on('complete', () => {
            document.getElementById('loading').style.display = 'none';
        });
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 3000);

        TRAVEL_DATA.days.forEach((day, idx) => {
            const dc = DAY_COLORS[idx];
            visibleDays.add(idx);
            renderDayOnMap(day, idx, dc);
        });

        renderSidebar();
        renderLegend();
        fitView();
    }

    function renderDayOnMap(day, dayIdx, dc) {
        const path = [];
        day.places.forEach((place, pIdx) => {
            const pos = [place.longitude, place.latitude];
            path.push(pos);

            const num = pIdx + 1;
            const marker = new AMap.Marker({
                position: pos,
                map: map,
                title: place.name,
                content: `<div style="position:relative;">
                    <div style="width:30px;height:30px;border-radius:50% 50% 50% 0;
                        background:${dc.color};transform:rotate(-45deg);
                        box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>
                    <div style="position:absolute;top:2px;left:0;width:30px;text-align:center;
                        color:#fff;font-size:14px;font-weight:700;">${num}</div>
                </div>`,
                offset: new AMap.Pixel(-15, -30)
            });

            const infoContent = `
                <div style="padding:8px 12px;min-width:220px;">
                    <div style="font-size:15px;font-weight:700;color:${dc.color};margin-bottom:6px;">
                        ${place.name}
                    </div>
                    <div style="font-size:12px;color:#7f8c8d;margin-bottom:4px;">
                        <span style="background:${dc.bg};color:${dc.color};padding:2px 8px;border-radius:4px;">${place.type}</span>
                        <span style="margin-left:8px;">${place.duration}</span>
                    </div>
                    <div style="font-size:13px;color:#555;line-height:1.6;margin-top:6px;">
                        ${place.description}
                    </div>
                </div>`;

            marker.on('click', () => {
                map.setZoomAndCenter(15, pos);
            });

            const infoWindow = new AMap.InfoWindow({
                content: infoContent,
                offset: new AMap.Pixel(0, -30)
            });
            marker.infoWindow = infoWindow;
            marker.on('click', () => {
                infoWindow.open(map, pos);
            });

            markers.push({ dayIdx, marker });
        });

        if (path.length >= 2) {
            const polyline = new AMap.Polyline({
                path: path,
                map: map,
                strokeColor: dc.color,
                strokeWeight: 4,
                strokeOpacity: 0.8,
                strokeStyle: 'solid',
                showDir: true,
                lineJoin: 'round',
                lineCap: 'round'
            });
            polylines.push({ dayIdx, polyline });
        }
    }

    function renderSidebar() {
        const container = document.getElementById('dayList');
        container.innerHTML = '';
        TRAVEL_DATA.days.forEach((day, idx) => {
            const dc = DAY_COLORS[idx];
            const card = document.createElement('div');
            card.className = 'day-card active';
            card.id = `dayCard-${idx}`;
            card.onclick = () => focusDay(idx);

            let placesHtml = day.places.map((p, pIdx) => `
                <div class="place-item" onclick="focusPlace(${idx}, ${pIdx})">
                    <div class="place-icon" style="background:${dc.color}">${pIdx + 1}</div>
                    <div class="place-info">
                        <div class="place-name">${p.name}</div>
                        <div class="place-meta">${p.type} · ${p.duration}</div>
                        <div class="place-desc">${p.description}</div>
                    </div>
                </div>`).join('');

            card.innerHTML = `
                <div class="day-header" style="background:${dc.color}">
                    <span class="day-num">Day ${day.day}</span>
                    <span class="day-weather">${day.weather}</span>
                </div>
                <div class="day-body">${placesHtml}</div>`;
            container.appendChild(card);
        });
    }

    function renderLegend() {
        const legend = document.getElementById('legend');
        let html = '';
        TRAVEL_DATA.days.forEach((day, idx) => {
            const dc = DAY_COLORS[idx];
            html += `<div class="legend-item" style="cursor:pointer;" onclick="toggleDay(${idx})">
                <div class="legend-dot" style="background:${dc.color}"></div>
                <span>Day ${day.day}</span>
            </div>`;
        });
        legend.innerHTML = html;
    }

    function toggleDay(idx) {
        if (visibleDays.has(idx)) {
            visibleDays.delete(idx);
            markers.filter(m => m.dayIdx === idx).forEach(m => m.marker.hide());
            polylines.filter(p => p.dayIdx === idx).forEach(p => p.polyline.hide());
            document.getElementById(`dayCard-${idx}`).style.opacity = '0.4';
        } else {
            visibleDays.add(idx);
            markers.filter(m => m.dayIdx === idx).forEach(m => m.marker.show());
            polylines.filter(p => p.dayIdx === idx).forEach(p => p.polyline.show());
            document.getElementById(`dayCard-${idx}`).style.opacity = '1';
        }
        fitView();
    }

    function focusDay(idx) {
        const dc = DAY_COLORS[idx];
        document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`dayCard-${idx}`).classList.add('active');

        const dayPlaces = markers.filter(m => m.dayIdx === idx);
        if (dayPlaces.length > 0) {
            const firstPos = dayPlaces[0].marker.getPosition();
            map.setZoomAndCenter(13, [firstPos.lng, firstPos.lat]);
        }
    }

    function focusPlace(dayIdx, placeIdx) {
        const m = markers.find(m => m.dayIdx === dayIdx && m.marker.title === TRAVEL_DATA.days[dayIdx].places[placeIdx].name);
        if (m) {
            const pos = m.marker.getPosition();
            map.setZoomAndCenter(15, [pos.lng, pos.lat]);
            m.infoWindow.open(map, [pos.lng, pos.lat]);
        }
    }

    function fitView() {
        const allVisible = markers.filter(m => visibleDays.has(m.dayIdx)).map(m => m.marker);
        if (allVisible.length > 0) {
            map.setFitView(allVisible, false, [60, 60, 60, 60]);
        }
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const btn = document.getElementById('toggleSidebar');
        if (sb.style.display === 'none') {
            sb.style.display = '';
            btn.textContent = '隐藏行程';
        } else {
            sb.style.display = 'none';
            btn.textContent = '显示行程';
        }
    }

    init();
    </script>
</body>
</html>
